{namespace neos=Neos\Neos\ViewHelpers}{namespace review=CodeQ\WorkspaceReview\ViewHelpers}<f:comment>NodeType has no "ui" accessor, so the core partial's "nodeType.ui.icon" is always empty; the icon lives in the full configuration.</f:comment><neos:backend.documentBreadcrumbPath node="{node}"><f:for each="{documentNodes}" as="documentNode" iteration="{iterator}">/<f:if condition="{showIcon}"> <i class="{review:nodeTypeIcon(icon: documentNode.nodeType.fullConfiguration.ui.icon)}" title="{f:if(condition: documentNode.nodeType.label, then: '{neos:backend.translate(id: documentNode.nodeType.label)}', else: documentNode.nodeType.name)}" data-neos-toggle="tooltip"></i></f:if> <review:cleanLabel value="{documentNode.label}" /> </f:for></neos:backend.documentBreadcrumbPath>
