# Replace the controller of the existing Management > Workspaces module.
# The module path stays "management/workspaces", so all existing privilege
# targets and menu entries keep working; only the implementation is swapped.
Neos:
  Neos:
    modules:
      management:
        submodules:
          workspaces:
            controller: 'CodeQ\WorkspaceReview\Controller\Module\Management\WorkspacesController'
            additionalResources:
              styleSheets:
                - 'resource://CodeQ.WorkspaceReview/Public/Styles/WorkspaceReview.css'
              javaScripts:
                - 'resource://CodeQ.WorkspaceReview/Public/JavaScript/PageNavigation.js'
    fusion:
      autoInclude:
        # Marks content elements for the visual compare, see Root.fusion.
        'CodeQ.WorkspaceReview': true

  Flow:
    mvc:
      routes:
        'CodeQ.WorkspaceReview':
          position: 'before Neos.Neos'
    security:
      authentication:
        providers:
          'Neos.Neos:Backend':
            requestPatterns:
              # The backend session must also authenticate the preview
              # rendering, which lives outside the module and the Neos
              # controller namespaces the provider covers by default.
              'CodeQ.WorkspaceReview:PreviewController':
                pattern: ControllerObjectName
                patternOptions:
                  controllerObjectNamePattern: 'CodeQ\WorkspaceReview\Controller\PreviewController'
